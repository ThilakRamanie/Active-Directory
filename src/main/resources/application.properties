# LDAP Configuration
ldap.url=ldap://ldap.forumsys.com:389
ldap.base=dc=example,dc=com
ldap.userDn=cn=read-only-admin,dc=example,dc=com
ldap.password=password
ldap.userSearchBase=
ldap.userSearchFilter=(uid={0})
ldap.groupSearchBase=
ldap.groupSearchFilter=(member={0})

# Server Configuration
server.port=12000
server.address=0.0.0.0

# Allow all origins for CORS (for testing only)
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
management.endpoints.web.cors.allowed-headers=*

# Logging Configuration
logging.level.org.springframework.ldap=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.root=INFO

# Application Info
info.app.name=LDAP Integration Demo
info.app.description=Demo application for LDAP/Active Directory integration
info.app.version=1.0.0

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always